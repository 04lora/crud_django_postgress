<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Confirmar Eliminación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4" style="max-width: 500px;">
    <div class="card card-body text-center shadow-sm">
        <h3>¿Eliminar este registro?</h3>
        <p class="text-muted">{{ registro.nombres }} {{ registro.apellidos }} - {{ registro.documento }}</p>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Sí, eliminar</button>
            <a href="{% url 'lista_asistencia' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</body>
</html>
